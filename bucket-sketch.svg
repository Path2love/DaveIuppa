  <line x1="700" y1="465" x2="710" y2="465"></line>
  <line x1="700" y1="660" x2="714" y2="660"></line>
  <line x1="700" y1="309" x2="707" y2="309"></line>
  <line x1="700" y1="348" x2="707" y2="348"></line>
  <line x1="700" y1="387" x2="707" y2="387"></line>
  <line x1="700" y1="426" x2="707" y2="426"></line>
  <line x1="700" y1="504" x2="707" y2="504"></line>
  <line x1="700" y1="543" x2="707" y2="543"></line>
  <line x1="700" y1="582" x2="707" y2="582"></line>
  <line x1="700" y1="621" x2="707" y2="621"></line>
</g>
<text x="720" y="274" font-size="11" font-family="monospace" fill="#1d1f20" opacity="0.5">100%</text>
<text x="716" y="469" font-size="11" font-family="monospace" fill="#1d1f20" opacity="0.5">50%</text>
<text x="720" y="664" font-size="11" font-family="monospace" fill="#1d1f20" opacity="0.5">0%</text>
<text x="700" y="248" font-size="10" letter-spacing="1.5" font-family="monospace" fill="#1d1f20" opacity="0.4">CAPACITY</text>

<!-- target capacity dashed line -->
<line x1="366" y1="330" x2="634" y2="330" stroke="#416180" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6"></line>
<text x="700" y="333" font-size="10.5" font-family="monospace" fill="#416180" opacity="0.75">TARGET</text>

<!-- leak streams (drawn under bucket body edge) -->
<g stroke="#5980a6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
  <path d="M383 484 C 365 530, 400 560, 375 610 C 355 650, 385 690, 360 760"></path>
  <path d="M500 655 C 490 690, 512 715, 500 760"></path>
  <path d="M607 551 C 630 590, 600 620, 625 660 C 645 695, 615 725, 640 760"></path>
</g>

<!-- bucket body -->
<g stroke="#1d1f20" stroke-width="1.8" fill="#f2f2f3">
  <path d="M350 270 L650 270 L590 660 A 90 22 0 0 1 410 660 Z"></path>
</g>

<!-- waterline + ripple -->
<path d="M390 380 Q 500 398 610 380" stroke="#5980a6" stroke-width="1.6" fill="none" opacity="0.8"></path>
<g stroke="#5980a6" stroke-width="1.1" fill="none" opacity="0.4">
  <path d="M420 364 Q 440 371 460 364"></path>
  <path d="M470 361 Q 495 369 520 361"></path>
  <path d="M540 364 Q 560 371 580 364"></path>
