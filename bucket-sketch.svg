<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="Arial, sans-serif">
<rect width="1000" height="1000" fill="#f2f2f3"></rect>
<defs>
  <pattern id="dots2" width="44" height="44" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#1d1f20" opacity="0.08"></circle>
  </pattern>
</defs>
<rect width="1000" height="1000" fill="url(#dots2)"></rect>
<rect x="48" y="48" width="904" height="904" fill="none" stroke="#1d1f20" stroke-opacity="0.3" stroke-width="1.5"></rect>
<g stroke="#1d1f20" stroke-width="1.5" opacity="0.5">
  <line x1="48" y1="48" x2="80" y2="48"></line><line x1="48" y1="48" x2="48" y2="80"></line>
  <line x1="952" y1="48" x2="920" y2="48"></line><line x1="952" y1="48" x2="952" y2="80"></line>
  <line x1="48" y1="952" x2="80" y2="952"></line><line x1="48" y1="952" x2="48" y2="920"></line>
  <line x1="952" y1="952" x2="920" y2="952"></line><line x1="952" y1="952" x2="952" y2="920"></line>
</g>
<text x="90" y="106" font-size="13" letter-spacing="2" font-family="monospace" fill="#1d1f20" opacity="0.5">FIG. 01 — THE LEAKY OPERATIONS BUCKET</text>
<text x="90" y="126" font-size="10.5" letter-spacing="1.5" font-family="monospace" fill="#1d1f20" opacity="0.38">CAPACITY LOST TO MANUAL PROCESS</text>

