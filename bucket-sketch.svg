<!-- rim -->
<ellipse cx="500" cy="270" rx="150" ry="32" fill="#eef6ff" stroke="#1d1f20" stroke-width="1.8"></ellipse>
<ellipse cx="500" cy="270" rx="150" ry="14" fill="none" stroke="#1d1f20" stroke-width="1.2" opacity="0.6"></ellipse>

<!-- droplets + splash -->
<g fill="#597ea3" stroke="none" opacity="0.9">
  <ellipse cx="360" cy="752" rx="4.5" ry="7"></ellipse>
  <ellipse cx="500" cy="752" rx="4.5" ry="7"></ellipse>
  <ellipse cx="640" cy="752" rx="4.5" ry="7"></ellipse>
</g>
<g stroke="#5980a6" fill="none" opacity="0.45">
  <ellipse cx="360" cy="764" rx="14" ry="4.5"></ellipse>
  <ellipse cx="360" cy="764" rx="24" ry="7.5" opacity="0.6"></ellipse>
  <ellipse cx="500" cy="764" rx="14" ry="4.5"></ellipse>
  <ellipse cx="500" cy="764" rx="24" ry="7.5" opacity="0.6"></ellipse>
  <ellipse cx="640" cy="764" rx="14" ry="4.5"></ellipse>
  <ellipse cx="640" cy="764" rx="24" ry="7.5" opacity="0.6"></ellipse>
</g>

<!-- leader lines to labels -->
<g stroke="#1d1f20" stroke-width="1" stroke-dasharray="2 3" opacity="0.4">
  <line x1="360" y1="770" x2="300" y2="838"></line>
  <line x1="500" y1="770" x2="500" y2="838"></line>
  <line x1="640" y1="770" x2="700" y2="838"></line>
</g>

<!-- labels -->
<g font-size="13" fill="#1d1f20" opacity="0.85">
  <rect x="180" y="838" width="240" height="40" fill="#f2f2f3" stroke="#1d1f20" stroke-width="1.3"></rect>
  <text x="300" y="863" text-anchor="middle">MANUAL ONBOARDING</text>
  <rect x="380" y="838" width="240" height="40" fill="#f2f2f3" stroke="#1d1f20" stroke-width="1.3"></rect>
  <text x="500" y="863" text-anchor="middle">SPAGHETTI TECH STACK</text>
  <rect x="580" y="838" width="240" height="40" fill="#f2f2f3" stroke="#1d1f20" stroke-width="1.3"></rect>
  <text x="700" y="863" text-anchor="middle">ZERO PROCESS SOPs</text>
</g>
</svg>
