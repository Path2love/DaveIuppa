<ellipse cx="500" cy="783" rx="190" ry="16" fill="#1d1f20" opacity="0.07"></ellipse>
<line x1="130" y1="783" x2="870" y2="783" stroke="#1d1f20" stroke-width="1.2" opacity="0.18"></line>

<!-- capacity gauge -->
